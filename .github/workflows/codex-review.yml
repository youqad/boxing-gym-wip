name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Fetch base and head refs
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt: |
            You are reviewing a pull request in the boxinggym-eval repository (multi-model BoxingGym evaluation framework).

            Get the diff:
              git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Review for the following, in priority order:

            1. **Correctness** — bugs in EIG computation, model-discovery scoring (ELPD/prediction error), or LiteLLM provider calls.
            2. **Asymmetric provider additions (BLOCKING)** — a new LLM provider added to experiment runs must also appear in cost tracking, dashboard aggregation, and sweep configs. Flag any partial additions.
            3. **Canonical data source violations** — README tables, HF Space content, or dashboard data updated from a source other than the canonical parquet snapshot.
            4. **Metric mixing** — EIG (experimental design) and prediction error/ELPD (model discovery) conflated or aggregated without explicit labeling.
            5. **Backward-compat additions** — alias fields, dual-read adapters, or legacy shims in runtime code are forbidden.
            6. **W&B sweep config completeness** — missing required sweep parameters that would only fail at runtime.
            7. **Security** — API keys in logs, unsafe file I/O, or injection risks in LLM prompt construction.

            Format your review as:
            ## Codex Review
            ### Blocking issues
            (file:line — description)
            ### Warnings
            (file:line — description)
            ### Notes
            (optional minor observations)

            Skip style nits. Be concise and specific.

  post:
    runs-on: ubuntu-latest
    needs: review
    if: needs.review.outputs.message != ''
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          CODEX_MSG: ${{ needs.review.outputs.message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_MSG
            });
